[package]
name = "sl7-primitives"
version = "0.1.0"
edition = "2024"
publish = false
autobins = false

[dependencies]
dashmap = "=6.2.1"
scc = "=3.8.8"
moka = { version = "=0.12.16", features = ["sync"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
turso = { version = "=0.8.3", default-features = false }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
tempfile = "3"

[profile.release]
debug = 1

[[bench]]
name = "primitives"
path = "src/main.rs"
harness = false
